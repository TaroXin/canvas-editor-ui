<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>script 引入 - canvas-editor-ui</title>
  <link rel="stylesheet" href="/playground.css" />
</head>
<body>
  <nav class="nav"><strong>canvas-editor-ui</strong><a href="/">首页</a><a href="/vanilla.html">原生 JS（ESM）</a><a href="/script.html">script 引入</a><a href="/vue2.html">Vue 2</a><a href="/vue2-script.html">Vue 2（script 引入）</a><a href="/docx.html">Word 导入</a><a href="/image.html">图片排版</a><span class="actions" id="actions"></span></nav>
  <div id="app" class="app"></div>
  <script src="/sample-data.js"></script>
  <!-- 1. 编辑器核心（全局变量 window['canvas-editor']） -->
  <script src="/lib/canvas-editor.umd.js"></script>
  <!-- 2. 界面（全局变量 CanvasEditorUI） -->
  <script src="/lib/canvas-editor-ui.umd.js"></script>
  <script>
    // 设计模式下右键插入控件，与「控件属性」共用控件面板
    function registerInsertControlMenu(ui) {
      ui.editor.register.contextMenuList([{
        name: ui.locale.controlAdd,
        when: function (payload) {
          // 控件内部不允许新增（避免嵌套），光标在控件后缀上时插入到控件之后
          var element = payload.startElement
          var isInControl = !!(element && element.controlId) && element.controlComponent !== 'postfix'
          return payload.options.mode === 'design' && payload.editorTextFocus && !isInControl
        },
        callback: function () {
          new CanvasEditorUI.ControlPanel({ editor: ui.editor, locale: ui.locale })
        }
      }])
    }
    var ui = CanvasEditorUI.createEditorUI('#app', {
      data: window.SAMPLE_DATA,
      // 在默认按钮后追加一个自定义按钮
      toolbar: CanvasEditorUI.DEFAULT_TOOLBAR.concat(['|', {
        key: 'save',
        text: '保存',
        title: '打印 JSON 到控制台',
        keepEnabledInReadonly: true,
        onClick: function (ctx) {
          console.log(JSON.stringify(ctx.editor.command.getValue().data))
        }
      }]),
      // 开启编辑模式切换，仅用于演示；实际接入时通过 ui.setMode() 切换
      statusbar: CanvasEditorUI.DEFAULT_STATUSBAR.concat(['mode'])
    })
    registerInsertControlMenu(ui)
    window.ui = ui
    document.querySelectorAll('.nav a').forEach(function (a) { a.classList.toggle('active', a.getAttribute('href') === location.pathname) })
  </script>
</body>
</html>
